<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>今日简报｜Smart Morning Brief</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#111;--muted:#666;--muted2:#999;--line:#ddd;--soft:#eee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
header{max-width:1180px;margin:auto;padding:32px 18px 18px;display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.hero,.today-card,.panel,.brief-box,.card,.article-box{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.04)}
.hero{padding:28px}.kicker{margin:0 0 12px;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
h1{margin:0;font-size:42px;letter-spacing:-.06em;line-height:1.05}
.today-card{padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;background:#111;color:#fff}.date,.small{color:#cfcfcf;font-size:14px;line-height:1.55}.big-number{font-size:44px;letter-spacing:-.06em;font-weight:800}
.panel{max-width:1180px;margin:0 auto 16px;padding:16px}.tabs,.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
button,select{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 13px;border-radius:999px;font-size:14px;cursor:pointer}
button.active,button.primary{background:#111;color:#fff;border-color:#111;font-weight:700}button.ghost{background:#f5f5f5}
#status{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.brief-box,.article-box{max-width:1180px;margin:0 auto 16px;padding:20px}.brief-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.brief-title h2{margin:0;font-size:21px;letter-spacing:-.03em}.hint{color:#777;font-size:13px;line-height:1.6;margin:0 0 12px}
#smartArticle{color:#222;line-height:1.9;margin:0;white-space:pre-wrap;font-size:16px}.article-box details{border-top:1px solid var(--line);padding-top:14px}.article-box summary{cursor:pointer;font-weight:800}.raw-list{display:grid;gap:12px;margin-top:12px}.raw-item{background:#f7f7f7;border:1px solid #e5e5e5;border-radius:16px;padding:14px}.raw-item h3{margin:0 0 8px;font-size:16px}.raw-text{color:#444;line-height:1.7;font-size:14px;max-height:170px;overflow:auto}
main{max-width:1180px;margin:auto;padding:0 16px 42px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.card{padding:17px;min-height:238px;display:flex;flex-direction:column;gap:10px}.tag-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{width:max-content;padding:5px 9px;border-radius:999px;background:#eee;color:#333;font-size:12px;font-weight:800}.fav{border:0;padding:4px 7px;border-radius:10px;font-size:18px;background:transparent}.fav.saved{background:#111;color:#fff}.card h3{margin:0;font-size:18px;line-height:1.35;letter-spacing:-.02em}.meta{color:var(--muted2);font-size:13px}.summary{color:#444;line-height:1.6;font-size:14px}a{color:#111;text-decoration:none;margin-top:auto;font-weight:800;font-size:14px;border-bottom:1px solid #111;width:max-content}.empty{grid-column:1/-1;text-align:center;color:#777;padding:36px;background:#fff;border:1px solid var(--line);border-radius:24px}
footer{max-width:1180px;margin:auto;padding:0 18px 36px;color:#777;font-size:13px;line-height:1.6}
@media(max-width:760px){header{grid-template-columns:1fr;padding-top:18px}h1{font-size:34px}.hero,.today-card,.panel,.brief-box,.article-box{border-radius:0;border-left:0;border-right:0}button,select{font-size:13px}#smartArticle{font-size:15px}}
</style>
</head>
<body>
<header>
<section class="hero"><p class="kicker">Smart Morning Brief</p><h1 id="pageTitle">今日简报</h1></section>
<section class="today-card"><div><div class="date" id="dateText"></div><div class="big-number" id="newsCount">0</div><div class="small" id="countText">篇文章准备中</div></div><div class="small">TTS 朗读整理后的中文晨报；博客模式朗读清洗后的原文材料。</div></section>
</header>

<section class="panel">
<div class="tabs">
<button class="tab active" data-cat="all">首页：今日简报</button><button class="tab" data-cat="科技">科技</button><button class="tab" data-cat="AI">AI</button><button class="tab" data-cat="能源">能源</button><button class="tab" data-cat="太空">太空</button><button class="tab" data-cat="医疗">医疗</button><button class="tab" data-cat="收藏">收藏新闻</button>
</div>
<div class="controls">
<select id="language"><option value="zh-CN">中文</option><option value="en-US">English</option></select>
<select id="rate"><option value="0.85">慢速</option><option value="1" selected>正常</option><option value="1.15">稍快</option></select>
<button class="primary" id="oneClickBtn">一键生成晨报</button>
<button class="primary" id="fetchFullBtn">抓取原文</button>
<button class="primary" id="summaryBtn">智能整理长文</button>
<button class="primary" id="playBtn">TTS 播报晨报</button>
<button id="podcastBtn">博客模式：朗读原文</button>
<button class="ghost" id="clearBtn">清空缓存</button>
<button class="ghost" id="stopBtn">停止</button>
<button class="ghost" id="refreshBtn">刷新今日新闻</button>
</div>
<p id="status">准备加载新闻。</p>
</section>

<section class="brief-box">
<div class="brief-title"><h2 id="summaryTitle">智能整理十分钟晨报</h2><button id="copyBtn">复制晨报</button></div>
<p class="hint">会清洗网站导航/广告/页脚，把英文材料整理成中文晨报；使用 OpenRouter 生成中文晨报。</p>
<article id="smartArticle">点击“一键生成晨报”。</article>
</section>

<section class="article-box"><details><summary>已抓取/清洗后的原文材料（博客模式会读这里）</summary><div class="raw-list" id="rawList"></div></details></section>
<main id="news"></main>
<footer><p>需要先把 WORKER_BASE 改成你的 Cloudflare Worker 地址。</p></footer>

<script>
const WORKER_BASE = "https://morning-brief.aliradevere.workers.dev";

const feeds=[
{cat:"科技",source:"MIT Technology Review",url:"https://www.technologyreview.com/feed/"},
{cat:"AI",source:"VentureBeat AI",url:"https://venturebeat.com/category/ai/feed/"},
{cat:"能源",source:"CleanTechnica",url:"https://cleantechnica.com/feed/"},
{cat:"太空",source:"NASA",url:"https://www.nasa.gov/rss/dyn/breaking_news.rss"},
{cat:"医疗",source:"Medical Xpress",url:"https://medicalxpress.com/rss-feed/"}];

const backupItems=[
{cat:"科技",source:"MIT Technology Review",title:"MIT Technology Review 今日科技新闻",summary:"人工智能、芯片、互联网、机器人等方向的最新报道入口。",link:"https://www.technologyreview.com/"},
{cat:"AI",source:"VentureBeat AI",title:"VentureBeat AI 新闻",summary:"AI产品、模型、产业应用、企业服务与创业公司新闻入口。",link:"https://venturebeat.com/category/ai/"},
{cat:"能源",source:"IEA",title:"IEA 全球能源新闻",summary:"能源政策、电力、可再生能源、油气与全球市场动态入口。",link:"https://www.iea.org/news"},
{cat:"太空",source:"NASA",title:"NASA 新闻",summary:"航天任务、发射、空间科学、地球观测与深空探索新闻入口。",link:"https://www.nasa.gov/news/"},
{cat:"医疗",source:"WHO",title:"WHO 新闻",summary:"全球公共卫生、疾病防控、疫苗与医疗政策新闻入口。",link:"https://www.who.int/news"}];

let allItems=[],currentCat="all",fullArticles={},podcastTimer=null,podcastUntil=0;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function strip(html){const div=document.createElement("div");div.innerHTML=html||"";return(div.textContent||"").replace(/\s+/g," ").trim()}
function backend(path){return WORKER_BASE.replace(/\/$/,"")+path}
function uid(x){return btoa(unescape(encodeURIComponent(x.title+x.source))).replace(/=/g,"")}
function savedIds(){return JSON.parse(localStorage.getItem("saved-news")||"[]")}
function setSavedIds(ids){localStorage.setItem("saved-news",JSON.stringify(ids))}
function isSaved(x){return savedIds().includes(uid(x))}
function toggleSave(x){const id=uid(x);let ids=savedIds();ids=ids.includes(id)?ids.filter(v=>v!==id):[...ids,id];setSavedIds(ids);render()}
function currentItems(){if(currentCat==="收藏")return allItems.filter(isSaved);return currentCat==="all"?allItems:allItems.filter(x=>x.cat===currentCat)}
function splitSentences(t){return (t||"").replace(/\s+/g," ").split(/(?<=[。！？.!?])\s*/).filter(s=>s.length>22)}
function keywordsFor(cat){return {科技:["technology","chip","platform","device","robot","software","data","computer","brain","芯片","平台","设备","机器人","软件","数据"],AI:["AI","artificial intelligence","model","agent","search","Claude","DeepMind","生成式","模型","智能","算法","训练","推理"],能源:["energy","solar","battery","electric","grid","climate","nuclear","drone","能源","电池","电网","太阳能","储能","核能","气候"],太空:["space","NASA","launch","orbit","moon","mars","telescope","太空","发射","轨道","月球","火星","望远镜"],医疗:["medical","health","disease","drug","clinical","vaccine","aging","brain","医疗","健康","疾病","药物","临床","疫苗","衰老","大脑"]}[cat]||[]}

function cleanArticleText(raw){
  if(!raw) return "";
  let t = raw
    .replace(/&[#a-zA-Z0-9]+;/g," ")
    .replace(/\s+/g," ")
    .replace(/Skip to Content/gi," ")
    .replace(/You need to enable JavaScript to view this site\.?/gi," ")
    .replace(/Featured Topics|Newsletters|Events|Audio|Archive page|Privacy Policy|Terms of Service|Cookie Policy|Advertisement|Advertise with us|Contact us|About us|Careers|Write for us|Subscribe|Sign in|Sign up/gi," ");
  const stop = [
    "MIT Technology Review is a world-renowned",
    "The latest iteration of a legacy",
    "Get the latest updates",
    "Explore more newsletters",
    "Vercel Security Checkpoint",
    "We're verifying your browser",
    "Enable JavaScript to continue",
    "Click here to fix"
  ];
  for(const s of stop){
    const i=t.indexOf(s);
    if(i>600) t=t.slice(0,i);
  }
  const sentences = splitSentences(t)
    .map(s=>s.trim())
    .filter(s=>s.length>35 && s.length<420)
    .filter(s=>!/newsletter|privacy|cookie|terms|advertis|javascript|skip to|featured topics|sign in|sign up|vercel security|we're verifying/i.test(s));
  const seen=new Set(), out=[];
  for(const s of sentences){
    const key=s.toLowerCase().slice(0,80);
    if(!seen.has(key)){seen.add(key);out.push(s)}
    if(out.join(" ").length>9000) break;
  }
  return out.join(" ");
}

const zhMap=[
["artificial intelligence","人工智能"],["AI","人工智能"],["chip","芯片"],["chips","芯片"],["semiconductor","半导体"],["model","模型"],["models","模型"],["agent","智能体"],["agents","智能体"],["robot","机器人"],["robots","机器人"],
["energy","能源"],["solar","太阳能"],["battery","电池"],["grid","电网"],["electric","电动化"],["nuclear","核能"],["climate","气候"],
["space","太空"],["NASA","NASA"],["launch","发射"],["orbit","轨道"],["moon","月球"],["Mars","火星"],["telescope","望远镜"],
["medical","医疗"],["health","健康"],["disease","疾病"],["drug","药物"],["clinical","临床"],["vaccine","疫苗"],["aging","衰老"],["brain","大脑"],["implant","植入物"],
["Google","Google"],["DeepMind","DeepMind"],["search","搜索"],["cloud","云服务"],["data","数据"],["software","软件"],["startup","初创公司"],["funding","融资"]
];

function roughZh(text){
  let s=text;
  for(const [en,zh] of zhMap) s=s.replace(new RegExp("\\b"+en+"\\b","gi"),zh);
  return s;
}

function pickSentences(text, cat, max=3){
  const kws=keywordsFor(cat);
  const s=splitSentences(cleanArticleText(text));
  const scored=s.map(x=>({x,score:kws.reduce((n,k)=>n+(x.toLowerCase().includes(k.toLowerCase())?2:0),0)+Math.min(x.length/180,1)}));
  return scored.sort((a,b)=>b.score-a.score).slice(0,max).map(o=>o.x);
}

async function loadFeed(feed){
  const res=await fetch(backend("/rss?url="+encodeURIComponent(feed.url)));
  const text=await res.text();
  const xml=new DOMParser().parseFromString(text,"text/xml");
  return Array.from(xml.querySelectorAll("item, entry")).slice(0,7).map(n=>({
    cat:feed.cat,source:feed.source,title:strip(n.querySelector("title")?.textContent),
    link:n.querySelector("link")?.getAttribute("href")||n.querySelector("link")?.textContent||"#",
    date:n.querySelector("pubDate, published, updated")?.textContent||"",
    summary:strip(n.querySelector("description, summary, content\\:encoded, encoded")?.textContent).slice(0,360)
  })).filter(x=>x.title)
}

function render(){
  const items=currentItems();
  $("#newsCount").textContent=items.length;
  $("#countText").textContent=$("#language").value.startsWith("zh")?"篇文章准备中":"articles ready";
  $("#news").innerHTML=items.length?items.map(x=>`<article class="card"><div class="tag-row"><div class="tag">${x.cat}</div><button class="fav ${isSaved(x)?"saved":""}" data-index="${allItems.indexOf(x)}">${isSaved(x)?"★":"☆"}</button></div><h3>${x.title}</h3><div class="meta">${x.source}${x.date?" · "+new Date(x.date).toLocaleString("zh-CN"):""}</div><div class="summary">${x.summary||"抓取原文后会参与晨报整理。"}</div><a href="${x.link}" target="_blank" rel="noopener">查看原文详情 →</a></article>`).join(""):`<div class="empty">这个分类暂时没有内容。</div>`;
  $$(".fav").forEach(btn=>btn.onclick=()=>toggleSave(allItems[Number(btn.dataset.index)]));
  renderRawList();
}
function renderRawList(){
  const articles=currentItems().map(x=>({item:x,text:fullArticles[uid(x)]})).filter(x=>x.text);
  $("#rawList").innerHTML=articles.length?articles.map(({item,text})=>`<div class="raw-item"><h3>${item.title}</h3><div class="meta">${item.source} · ${item.cat}</div><div class="raw-text">${text}</div></div>`).join(""):`<div class="raw-item"><div class="raw-text">还没有抓取到材料。</div></div>`;
}
async function loadNews(){
  $("#status").textContent="正在抓取新闻列表。";
  const results=await Promise.allSettled(feeds.map(loadFeed));
  const live=results.flatMap(r=>r.status==="fulfilled"?r.value:[]);
  allItems=live.length?live:backupItems;
  localStorage.setItem("news-cache",JSON.stringify({date:new Date().toDateString(),items:allItems}));
  render();
  $("#status").textContent=live.length?`已更新 ${live.length} 篇文章列表。`:"实时 RSS 抓取失败，已显示备用入口。";
}
function loadCacheFirst(){
  try{const cache=JSON.parse(localStorage.getItem("news-cache")||"{}");allItems=cache.items?.length?cache.items:backupItems}catch{allItems=backupItems}
  try{fullArticles=JSON.parse(localStorage.getItem("full-articles")||"{}")}catch{fullArticles={}}
  render()
}
async function extractArticleText(item){
  try{
    const res=await fetch(backend("/extract?url="+encodeURIComponent(item.link)));
    const data=await res.json();
    const cleaned=cleanArticleText(data.text||"");
    return cleaned || cleanArticleText(item.summary||"");
  }catch(e){return cleanArticleText(item.summary||"")}
}
async function fetchFullArticles(){
  const items=currentItems().slice(0,14);
  $("#status").textContent=`正在抓取并清洗 ${items.length} 篇材料。`;
  for(let i=0;i<items.length;i++){
    const item=items[i], id=uid(item);
    if(fullArticles[id] && !fullArticles[id].includes("RSS 摘要补齐") && !fullArticles[id].includes("未能抓取")) continue;
    $("#status").textContent=`正在处理 ${i+1}/${items.length}：${item.title}`;
    const text=await extractArticleText(item);
    fullArticles[id]=text || `【RSS 摘要补齐】${item.summary||item.title}`;
    localStorage.setItem("full-articles",JSON.stringify(fullArticles));
    renderRawList();
  }
  $("#status").textContent="材料处理完成，可以智能整理长文。";
}

async function makeSmartBrief(){
  const items = currentItems().slice(0,14);

  if(!items.length){
    $("#smartArticle").textContent = "当前分类没有内容。";
    return;
  }

  $("#status").textContent = "正在调用 OpenRouter 生成中文晨报。";

  const articles = items.map(item => ({
    cat: item.cat,
    source: item.source,
    title: item.title,
    summary: item.summary || "",
    text: fullArticles[uid(item)] || item.summary || ""
  }));

  try{
    const res = await fetch(backend("/brief"), {
      method: "POST",
      headers: {
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        articles
      })
    });

    const data = await res.json();

    if(data.article){
      $("#smartArticle").textContent = data.article;
      $("#status").textContent = "中文晨报已生成。";
    }else{
      $("#smartArticle").textContent =
        "OpenRouter返回为空：\n\n" +
        JSON.stringify(data,null,2);
    }

  }catch(e){
    $("#smartArticle").textContent =
      "调用失败：\n\n" + e.message;
  }
}
function makeEnglishBrief(items){
  return "Today's global industry brief:\n\n"+items.map(item=>`From ${item.source}, "${item.title}" suggests: ${pickSentences(fullArticles[uid(item)]||item.summary,item.cat,2).join(" ")||item.summary||""}`).join("\n\n");
}
async function oneClick(){
  await fetchFullArticles();
  await makeSmartBrief();
  speakSmartBrief();
}
function speak(text){if(!("speechSynthesis"in window)){$("#status").textContent="当前浏览器不支持 TTS。";return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=$("#language").value;u.rate=Number($("#rate").value);speechSynthesis.speak(u)}
function speakSmartBrief(){const text=$("#smartArticle").textContent.trim();if(!text||text.includes("点击")){makeSmartBrief();speak($("#smartArticle").textContent)}else speak(text)}
function startOriginalPodcast(){
  const zh=$("#language").value.startsWith("zh"), items=currentItems().filter(x=>fullArticles[uid(x)]).slice(0,10);
  if(!items.length){$("#status").textContent="还没有原文材料；请先点“抓取原文”。";return}
  podcastUntil=Date.now()+10*60*1000;let idx=0;$("#status").textContent=zh?"博客模式开始：正在朗读清洗后的原文材料。":"Podcast mode: reading cleaned source materials.";
  function next(){
    if(Date.now()>podcastUntil||idx>=items.length){stopAll();return}
    const item=items[idx++], text=(zh?`现在朗读，来源 ${item.source}，标题 ${item.title}。`:`Reading from ${item.source}, titled ${item.title}. `)+(fullArticles[uid(item)]||"");
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.slice(0,15000));u.lang=$("#language").value;u.rate=Number($("#rate").value);u.onend=()=>{if(Date.now()<=podcastUntil)podcastTimer=setTimeout(next,800)};speechSynthesis.speak(u)
  }
  next()
}
function stopAll(){speechSynthesis.cancel();clearTimeout(podcastTimer);$("#status").textContent=$("#language").value.startsWith("zh")?"已停止播放。":"Playback stopped."}
function clearCache(){localStorage.removeItem("full-articles");fullArticles={};renderRawList();$("#status").textContent="已清空原文缓存，请重新抓取。"}
window.addEventListener("DOMContentLoaded",()=>{
  $("#dateText").textContent=new Date().toLocaleDateString("zh-CN",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  $$(".tab").forEach(btn=>btn.onclick=()=>{$$(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentCat=btn.dataset.cat;render()});
  $("#oneClickBtn").onclick=oneClick;$("#fetchFullBtn").onclick=fetchFullArticles;$("#summaryBtn").onclick=makeSmartBrief;$("#playBtn").onclick=speakSmartBrief;$("#podcastBtn").onclick=startOriginalPodcast;$("#stopBtn").onclick=stopAll;$("#refreshBtn").onclick=loadNews;$("#clearBtn").onclick=clearCache;
  $("#copyBtn").onclick=async()=>{await navigator.clipboard.writeText($("#smartArticle").textContent);$("#status").textContent="晨报已复制。"};
  $("#language").onchange=()=>{const zh=$("#language").value.startsWith("zh");$("#pageTitle").textContent=zh?"今日简报":"Daily Brief";$("#summaryTitle").textContent=zh?"智能整理十分钟晨报":"Smart 10-Minute Brief";render()};
  loadCacheFirst();loadNews();
});
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}</script>
</body>
</html>
